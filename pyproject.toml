[project]
name = "tqz"
version = "2.5.0"
description = "tqz (TurboQuant) - lossless compression for every file type + web console"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TurboQuant Contributors" }]
keywords = ["compression", "lossless", "dedup", "zstd", "backup", "arabic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving :: Compression",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Natural Language :: Arabic",
  "Natural Language :: English",
]
dependencies = ["Pillow>=10.0"]
[project.optional-dependencies]
max = ["zstandard>=0.22", "brotli>=1.1"]
full = ["zstandard>=0.22", "brotli>=1.1", "pikepdf>=8", "soundfile>=0.12"]
secure = ["cryptography>=41"]
dev = ["pytest>=7", "build", "twine"]
[project.urls]
Homepage = "https://github.com/aslamalkarywk7/TurboQuant"
Documentation = "https://github.com/aslamalkarywk7/TurboQuant#readme"
Repository = "https://github.com/aslamalkarywk7/TurboQuant"
"Bug Tracker" = "https://github.com/aslamalkarywk7/TurboQuant/issues"
[project.scripts]
tqz = "turboquant.cli:main"
tqz-gui = "gui.app:main"
turboquant = "turboquant.cli:main"
turboquant-gui = "gui.app:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["turboquant*", "gui*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
