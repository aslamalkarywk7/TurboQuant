name: Feature request
description: Propose an enhancement
body:
  - type: textarea
    id: use-case
    attributes: {label: Use case, description: "Who needs it, file type/size, why modes/advanced/jobs do not solve it"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: "API sketch (function signature or CLI flag) + docs to update"}
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Keeps lossless guarantee (or is explicit lossy for images/media only)
        - label: No new base dependency (optional extras only)
        - label: Includes round-trip + corrupt-input tests
